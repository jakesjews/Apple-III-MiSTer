# 4 KiB boot ROM; the copied routines sit at their original addresses.
MEMORY {
    ROM: start = $F000, size = $1000, file = %O, fill = yes, fillval = $FF;
}
SEGMENTS {
    CODE:    load = ROM, type = ro, start = $F000;
    ANALOG:  load = ROM, type = ro, start = $F4A8;
    PREAD:   load = ROM, type = ro, start = $FB1E;
    WAIT:    load = ROM, type = ro, start = $FCA8;
    JOY2:    load = ROM, type = ro, start = $FCC9;
    VECTORS: load = ROM, type = ro, start = $FFFA;
}
