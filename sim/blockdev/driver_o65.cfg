# ld65 configuration for a relocatable SOS driver: the TEXT segment is the
# comment record and DATA is the DIBs and code, written as an o65 file that
# sos_driver.py converts into a SOS.DRIVER record.
MEMORY {
    ROM: start=$0, size=$b800, type=ro, define=yes, file=%O;
    RAM: start=$0, size=$b800, type=rw, define=yes, file=%O;
}
SEGMENTS {
    TEXT: load=ROM, type=ro;
    DATA: load=RAM, type=rw;
}
FILES { %O: format=o65; }
FORMATS { o65: os=lunix, version=0, type=small; }
